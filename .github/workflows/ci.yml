name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pyyaml numpy opencv-python-headless onnx
      - name: Lint and unit tests (no board, no GPU)
        run: tests/run_tests.sh
      - name: Shell syntax
        run: for f in scripts/*.sh skills/*/scripts/*.sh; do bash -n "$f"; done
