---
title: "Detector on an H.264 video file -> saved video"
inputs:
    input0:
        source: /opt/edgeai-test-data/videos/video0_1280_768.h264
        format: h264
        width: 1280
        height: 768
        framerate: 30
        loop: False
models:
    model0:
        model_path: /opt/model_zoo/ONR-OD-8200-yolox-nano-lite-mmdet-coco-416x416
        viz_threshold: 0.5
outputs:
    output0:
        sink: /opt/edgeai-test-data/output/example.mkv
        width: 1280
        height: 768
flows:
    flow0: [input0,model0,output0]
