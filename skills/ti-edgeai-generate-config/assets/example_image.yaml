---
title: "Detector on an image sequence -> saved images"
inputs:
    input0:
        source: /opt/edgeai-test-data/images/%04d.jpg
        width: 1280
        height: 720
        framerate: 1
        loop: False
        index: 0
models:
    model0:
        model_path: /opt/model_zoo/ONR-OD-8200-yolox-nano-lite-mmdet-coco-416x416
        viz_threshold: 0.5
outputs:
    output0:
        sink: /opt/edgeai-test-data/output/example_%04d.jpg
        width: 1280
        height: 720
flows:
    flow0: [input0,model0,output0]
