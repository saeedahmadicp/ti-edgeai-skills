---
# /dev/video2 is only an example: use the capture node and mode reported by scripts/discover_cameras.sh
title: "USB webcam (YUYV) -> detector -> saved frames"
inputs:
    input0:
        source: /dev/video2
        format: auto
        width: 640
        height: 360
        framerate: 30
models:
    model0:
        model_path: /opt/model_zoo/ONR-OD-8200-yolox-nano-lite-mmdet-coco-416x416
        viz_threshold: 0.5
outputs:
    output0:
        sink: /opt/edgeai-test-data/output/webcam_%04d.jpg
        width: 640
        height: 360
flows:
    flow0: [input0,model0,output0]
